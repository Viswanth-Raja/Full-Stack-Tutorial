<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />
    <title>Form</title>
  </head>
  <body>
    <div class="container mt-5">
      <div class="mt-5">
        <label for="range3" class="form-label">Example range</label>
        <input
          type="range"
          class="form-range"
          min="0"
          max="5"
          step="1"
          id="range3"
        />
      </div>
      <div class="input-group mt-5">
        <input
          type="text"
          class="form-control"
          placeholder="Recipient's email"
          aria-label="Recipient's Email"
          aria-describedby="emailInfo"
        />
        <span class="input-group-text" id="emailInfo">@example.com</span>
      </div>
      <div class="form-floating mt-3">
        <input
          type="email"
          class="form-control"
          id="floatingInput"
          placeholder="name@example.com"
        />
        <label for="floatingInput">Email address</label>
      </div>
      <div class="form-floating mt-5">
        <textarea
          type="textarea"
          class="form-control"
          id="comment"
          placeholder="Please share your thoughts"
          style="height: 100px"
        ></textarea>
        <label for="comment" class="form-label">Feedback</label>
      </div>
    </div>
    <div class="container mt-5">
      <form>
        <div class="mb-3">
          <label for="email" class="form-label">Email</label>
          <input
            type="email"
            id="email"
            class="form-control"
            placeholder="Please enter a Email Address"
            aria-describedby="emailId"
          />
          <div class="form-text" id="emailId">
            We will never share your email Id
          </div>
        </div>
        <div class="mb-3">
          <label for="password" class="form-label">Password</label>
          <input
            type="password"
            id="password"
            class="form-control-plaintext"
            placeholder="Please enter a password"
            aria-describedby="passwordInformation"
          />
          <div class="form-text" id="passwordInformation">
            We will never share your password
          </div>
        </div>
        <select
          class="form-select mb-3"
          multiple
          size="3"
          aria-label="Default select example"
        >
          <option selected>Open this select menu</option>
          <option value="1">One</option>
          <option value="2">Two</option>
          <option value="3">Three</option>
        </select>
        <div class="mb-3">
          <p>Gender</p>
          <div>
            <input
              id="radioDefault1"
              type="radio"
              class="form-check-input"
              name="radioDefault"
            />
            <label class="form-check-label" for="radioDefault1">Male</label>
          </div>
          <div>
            <input
              id="radioDefault2"
              type="radio"
              class="form-check-input"
              name="radioDefault"
            />
            <label class="form-check-label" for="radioDefault2">Female</label>
          </div>
          <div>
            <input
              id="radioDefault3"
              type="radio"
              class="form-check-input"
              name="radioDefault"
            />
            <label class="form-check-label" for="radioDefault3">Other</label>
          </div>
        </div>
        <div class="mb-3">
          <label for="exampleFormControlTextarea1" class="form-label"
            >Example textarea</label
          >
          <textarea
            class="form-control"
            id="exampleFormControlTextarea1"
            rows="3"
          ></textarea>
        </div>
        <div class="mb-3">
          <label for="formFile" class="form-label"
            >Default file input example</label
          >
          <input
            class="form-control form-control-sm"
            type="file"
            id="formFile"
          />
        </div>
        <div class="mb-3">
          <input type="checkbox" id="checkbox" class="form-check-input" />
          <label for="checkbox" class="form-check-label"
            >I agree that the above details of my own was given with my
            approval</label
          >
        </div>
        <button type="submit" class="btn btn-success">Submit</button>
      </form>
    </div>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
